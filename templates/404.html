{% extends "base.html" %}

{% block title %}{{ site_name }} | Not Found{% endblock %}

{% block content %}
<main class="mx-auto max-w-4xl px-4 py-16 lg:px-6">
  <section class="surface-panel rounded-3xl p-10 text-center shadow-sm">
    <p class="text-xs font-semibold uppercase tracking-[0.25em] text-dark_green">404</p>
    <h1 class="mt-2 text-4xl font-bold text-slate-100">Page not found</h1>
    <p class="mt-4 text-sm text-slate-300">The listing or page you requested does not exist in the current local dataset.</p>
    <div class="mt-8 flex justify-center gap-3">
      <a href="{{ url_for('home') }}" class="rounded-full bg-emerald-600 px-5 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500">
        Go home
      </a>
      <a href="{{ url_for('listings_page') }}" class="rounded-full border border-slate-700 bg-slate-900 px-5 py-2 text-sm font-medium text-slate-200 transition hover:border-emerald-500 hover:text-emerald-300">
        Browse listings
      </a>
    </div>
  </section>
</main>
{% endblock %}
